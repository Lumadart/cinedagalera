<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#231B20">
  <title>Cine Arkham</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23F5B942'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='%232A1500'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://image.tmdb.org" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Tela de carregamento: fica aqui dentro para aparecer antes de qualquer outro arquivo carregar. */
    #splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; align-content: center; gap: 26px;
      background: radial-gradient(ellipse at 50% 38%, #4a3340 0%, #2e232a 55%, #231b20 100%); color: #F8EAD8;
      font-family: 'Baloo 2', system-ui, sans-serif; transition: opacity .6s ease, visibility .6s; }
    #splash.saindo { opacity: 0; visibility: hidden; pointer-events: none; }
    .sp-logo { position: relative; width: 132px; height: 132px; display: grid; place-items: center; }
    .sp-logo img { width: 96px; height: 96px; position: relative; animation: sp-pulso 2.4s ease-in-out infinite; filter: drop-shadow(0 6px 18px #F5B94233); }
    .sp-anel { position: absolute; inset: 0; border-radius: 50%; border: 2px dashed #F5B94266; animation: sp-gira 9s linear infinite; }
    .sp-anel.b { inset: 10px; border: 2px solid transparent; border-top-color: #F5B942; border-right-color: #F5B94255; animation: sp-gira 1.6s cubic-bezier(.5, .1, .5, .9) infinite; }
    .sp-nome { font-weight: 800; letter-spacing: .42em; text-indent: .42em; font-size: 1.05rem; color: #F5B942; text-transform: uppercase; }
    .sp-msgs { position: relative; height: 1.4em; width: min(80vw, 320px); text-align: center; color: #C2AEB8; font-size: .95rem; }
    .sp-msgs span { position: absolute; inset: 0; opacity: 0; animation: sp-msg 8s infinite; }
    .sp-msgs span:nth-child(2) { animation-delay: 2s; } .sp-msgs span:nth-child(3) { animation-delay: 4s; } .sp-msgs span:nth-child(4) { animation-delay: 6s; }
    .sp-barra { width: min(60vw, 220px); height: 3px; border-radius: 99px; background: #503b4b; overflow: hidden; }
    .sp-barra::after { content: ''; display: block; width: 40%; height: 100%; border-radius: 99px; background: linear-gradient(90deg, transparent, #F5B942, transparent); animation: sp-corre 1.5s ease-in-out infinite; }
    .sp-demora { position: absolute; bottom: 8vh; left: 0; right: 0; text-align: center; color: #C2AEB8; font-size: .85rem; opacity: 0; animation: sp-aparece .5s 9s forwards; padding: 0 24px; }
    @keyframes sp-gira { to { transform: rotate(360deg); } }
    @keyframes sp-pulso { 50% { transform: scale(1.06); } }
    @keyframes sp-corre { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    @keyframes sp-msg { 0%, 3% { opacity: 0; transform: translateY(6px); } 8%, 22% { opacity: 1; transform: none; } 27%, 100% { opacity: 0; transform: translateY(-6px); } }
    @keyframes sp-aparece { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .sp-anel, .sp-logo img, .sp-barra::after { animation: none; } .sp-msgs span { animation: none; } .sp-msgs span:first-child { opacity: 1; } }
  </style>
  <link rel="stylesheet" href="css/estilo.css">
  <link rel="modulepreload" href="js/app.js">
  <link rel="modulepreload" href="js/api.js">
  <link rel="modulepreload" href="js/config.js">
  <link rel="modulepreload" href="js/sessao.js">
  <link rel="modulepreload" href="js/dom.js">
  <link rel="modulepreload" href="js/estado.js">
  <link rel="modulepreload" href="js/ui.js">
  <link rel="modulepreload" href="js/aparencia.js">
  <link rel="modulepreload" href="js/dropdown.js">
  <link rel="modulepreload" href="js/cartao.js">
  <link rel="modulepreload" href="js/datas.js">
  <link rel="modulepreload" href="js/eventos.js">
  <link rel="modulepreload" href="js/badges.js">
  <link rel="modulepreload" href="js/compat.js">
  <link rel="modulepreload" href="js/telas/login.js">
  <link rel="modulepreload" href="js/telas/inicio.js">
  <link rel="modulepreload" href="js/telas/catalogo.js">
  <link rel="modulepreload" href="js/telas/titulo.js">
  <link rel="modulepreload" href="js/telas/perfil.js">
</head>
<body>
  <div id="splash" role="status" aria-live="polite" aria-label="Carregando o Cine Arkham">
    <div class="sp-logo"><span class="sp-anel"></span><span class="sp-anel b"></span><img src="img/logo.svg" alt=""></div>
    <div class="sp-nome">Cine Arkham</div>
    <div class="sp-msgs" aria-hidden="true"><span>Ajustando o projetor…</span><span>Passando a pipoca…</span><span>Escolhendo as poltronas…</span><span>Apagando as luzes…</span></div>
    <div class="sp-barra" aria-hidden="true"></div>
    <p class="sp-demora">Está demorando mais que o normal… se travar, atualize a página (Ctrl+F5).</p>
  </div>
  <div id="app"></div>
  <div id="avisos" class="avisos" role="status" aria-live="polite"></div>
  <noscript>Este site precisa de JavaScript para funcionar.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
